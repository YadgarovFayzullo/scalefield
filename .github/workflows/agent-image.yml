# Образ агента для серверов клиентов. Скрипт установки (src/lib/agent-install.ts)
# делает `docker compose pull` образа из AGENT_IMAGE — на чужом сервере нет ни
# нашего локального `status-api:latest`, ни логина в реестр, поэтому образ
# обязан лежать в ПУБЛИЧНОМ реестре. Собираем под amd64 и arm64 (Hetzner Ampere,
# Oracle Free Tier — arm). Пакет ghcr.io/<owner>/scalefield-agent создаётся
# приватным при первом пуше из приватного репозитория — переключить на Public
# один раз руками: github.com/users/<owner>/packages/container/scalefield-agent/settings.
name: agent-image

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/scalefield-agent" >> "$GITHUB_OUTPUT"
      # Дымовая проверка ДО публикации: 11.10 в GHCR уехал образ, падавший на
      # старте с ModuleNotFoundError (main.py импортировал удалённый модуль), и
      # агент клиента крутился в Restarting. Собираем amd64 в локальный docker и
      # импортируем приложение — слои уйдут в кэш и переиспользуются ниже.
      - uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64
          load: true
          tags: scalefield-agent:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm scalefield-agent:smoke python -c "import app.main; print('app.main imports OK')"
      - uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
